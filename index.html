<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>backpack_ver0.5</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        cursor: grab;
        user-select: none;
      }


      body:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
      }
    </style>


    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>


    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';


      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);


      const camera = new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        0.1,
        100,
      );
      camera.position.set(3.6, 2.45, 4.65);


      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('canvas'),
        antialias: true,
        alpha: false,
      });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));


      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.target.set(0, 1.34, 0);
      controls.minDistance = 3.4;
      controls.maxDistance = 7.5;


      scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d6d6, 2.25));


      const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
      keyLight.position.set(4, 5, 5);
      scene.add(keyLight);


      const fillLight = new THREE.DirectionalLight(0xffffff, 1.1);
      fillLight.position.set(-4, 3, -5);
      scene.add(fillLight);


      const backpack = new THREE.Group();
      backpack.position.y = -1.35;
      scene.add(backpack);


      const W = 2.25;
      const H = 2.95;
      const D = 1.36;
      const WALL = 0.055;
      const FRONT_D = 0.52;
      const BACK_D = D - FRONT_D;
      const Z_DIV = D / 2 - FRONT_D;
      const LID_D = FRONT_D - 0.02;
      const Z_HINGE = D / 2 - LID_D;


      function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }


      function makeCoverPatternTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#9bbcff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);


        ctx.fillStyle = '#fff5a8';
        [
          [150, 150, 22],
          [410, 210, 16],
          [760, 160, 20],
          [250, 430, 15],
          [620, 390, 18],
          [850, 500, 15],
          [160, 740, 20],
          [460, 780, 15],
          [760, 820, 19],
        ].forEach(([x, y, r]) => {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
            const b = a + Math.PI / 5;
            const ax = x + Math.cos(a) * r;
            const ay = y + Math.sin(a) * r;
            const bx = x + Math.cos(b) * r * 0.43;
            const by = y + Math.sin(b) * r * 0.43;
            if (i === 0) ctx.moveTo(ax, ay);
            else ctx.lineTo(ax, ay);
            ctx.lineTo(bx, by);
          }
          ctx.closePath();
          ctx.fill();
        });


        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        [
          [250, 290],
          [700, 640],
        ].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x - 38, y, 32, Math.PI * 0.9, Math.PI * 1.9);
          ctx.arc(x, y - 18, 40, Math.PI, Math.PI * 2);
          ctx.arc(x + 42, y, 32, Math.PI * 1.1, Math.PI * 0.1);
          ctx.closePath();
          ctx.fill();
        });


        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;
        return texture;
      }


      function makeBadgeTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 768;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff7c2';
        drawRoundedRect(ctx, 10, 10, 748, 236, 52);
        ctx.fill();
        ctx.fillStyle = '#ffd35a';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
          const b = a + Math.PI / 5;
          const ax = 110 + Math.cos(a) * 46;
          const ay = 128 + Math.sin(a) * 46;
          const bx = 110 + Math.cos(b) * 20;
          const by = 128 + Math.sin(b) * 20;
          if (i === 0) ctx.moveTo(ax, ay);
          else ctx.lineTo(ax, ay);
          ctx.lineTo(bx, by);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#31456d';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = '900 72px Arial, sans-serif';
        ctx.fillText('DREAM', 190, 104);
        ctx.font = '700 45px Arial, sans-serif';
        ctx.fillText('BACKPACK', 190, 168);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;
        return texture;
      }


      const coverPatternTex = makeCoverPatternTexture();
      const badgeTex = makeBadgeTexture();


      const matBag = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.92,
        metalness: 0.0,
      });
      const matBagSoft = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.94,
        metalness: 0.0,
      });
      const matPanel = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.92,
        metalness: 0.0,
      });
      const matCushion = new THREE.MeshStandardMaterial({
        color: 0x8d95a5,
        roughness: 0.96,
        metalness: 0.01,
      });
      const matStitch = new THREE.MeshStandardMaterial({
        color: 0xc9dbff,
        roughness: 0.95,
      });
      const matMetal = new THREE.MeshStandardMaterial({
        color: 0xf9cf58,
        roughness: 0.42,
        metalness: 0.18,
      });
      const matCover = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.92,
        metalness: 0.0,
      });


      const matGlass = new THREE.MeshPhysicalMaterial({
        color: 0xdff7ff,
        transparent: true,
        opacity: 0.28,
        roughness: 0.02,
        metalness: 0,
        transmission: 0.92,
        thickness: 0.08,
        ior: 1.45,
        clearcoat: 1,
        clearcoatRoughness: 0.03,
        side: THREE.DoubleSide,
      });


      const matGlassEdge = new THREE.LineBasicMaterial({
        color: 0x8fd8ff,
        transparent: true,
        opacity: 0.86,
      });


      const clickables = [];
      const drawerRows = [];


      const state = {
        coverOpen: false,
        lidOpen: false,
        drawersOpen: [false, false, false],
      };


      function roundedBox(w, h, d, radius = 0.04, segments = 4) {
        return new RoundedBoxGeometry(w, h, d, segments, radius);
      }


      function makeMesh(geo, mat, x = 0, y = 0, z = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        return m;
      }


      function addClick(obj, type, index = null) {
        obj.userData.type = type;
        if (index !== null) obj.userData.index = index;
        clickables.push(obj);
        return obj;
      }


      function makeTube(points, radius, mat, closed = false) {
        const curve = new THREE.CatmullRomCurve3(points, closed);
        return new THREE.Mesh(
          new THREE.TubeGeometry(curve, 80, radius, 12, closed),
          mat,
        );
      }


      function addEdges(target, colorMat = matGlassEdge) {
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(target.geometry),
          colorMat,
        );
        edges.position.copy(target.position);
        edges.rotation.copy(target.rotation);
        edges.scale.copy(target.scale);
        target.parent.add(edges);
        return edges;
      }


      const shell = new THREE.Group();
      backpack.add(shell);


      const bottom = makeMesh(
        roundedBox(W * 0.98, WALL, D * 0.98, 0.06),
        matBag,
        0,
        WALL / 2,
        0,
      );
      shell.add(bottom);


      const frontSideDepth = FRONT_D;
      const frontSideZ = Z_DIV + FRONT_D / 2;
      const leftSide = makeMesh(
        roundedBox(WALL, H, frontSideDepth, 0.06),
        matBag,
        -W / 2 + WALL / 2,
        H / 2,
        frontSideZ,
      );
      const rightSide = makeMesh(
        roundedBox(WALL, H, frontSideDepth, 0.06),
        matBag,
        W / 2 - WALL / 2,
        H / 2,
        frontSideZ,
      );
      shell.add(leftSide, rightSide);


      const frontFace = addClick(
        makeMesh(
          roundedBox(W * 0.98, H, WALL, 0.16, 6),
          matBag,
          0,
          H / 2,
          D / 2 - WALL / 2,
        ),
        'lid',
      );
      shell.add(frontFace);


      const frontEdgeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.9,
        metalness: 0.0,
      });
      const frontLeftPiping = makeMesh(
        roundedBox(0.045, H * 0.96, 0.045, 0.022),
        frontEdgeMat,
        -W / 2 + 0.02,
        H / 2,
        D / 2 + 0.012,
      );
      const frontRightPiping = makeMesh(
        roundedBox(0.045, H * 0.96, 0.045, 0.022),
        frontEdgeMat,
        W / 2 - 0.02,
        H / 2,
        D / 2 + 0.012,
      );
      const frontBottomPiping = makeMesh(
        roundedBox(W * 0.94, 0.045, 0.045, 0.022),
        frontEdgeMat,
        0,
        0.045,
        D / 2 + 0.012,
      );
      shell.add(frontLeftPiping, frontRightPiping, frontBottomPiping);


      // 서랍이 있는 쪽의 반대편, 즉 백팩을 실제로 메는 쪽에 자연스러운 어깨끈을 배치한다.
      // 이쪽은 frontFace 바깥(+Z) 방향이므로 coverGroup이 아니라 shell에 붙인다.
      const matShoulderStrap = new THREE.MeshStandardMaterial({
        color: 0xf8fbff,
        map: coverPatternTex,
        roughness: 0.96,
        metalness: 0.0,
      });
      const matShoulderStrapSide = new THREE.MeshStandardMaterial({
        color: 0xc9dbff,
        roughness: 0.98,
        metalness: 0.0,
      });
      const matShoulderStrapShadow = new THREE.MeshStandardMaterial({
        color: 0x778294,
        roughness: 0.98,
        metalness: 0.0,
      });


      function cubicPoint(p0, p1, p2, p3, t) {
        const u = 1 - t;
        return new THREE.Vector3(
          u * u * u * p0.x +
            3 * u * u * t * p1.x +
            3 * u * t * t * p2.x +
            t * t * t * p3.x,
          u * u * u * p0.y +
            3 * u * u * t * p1.y +
            3 * u * t * t * p2.y +
            t * t * t * p3.y,
          u * u * u * p0.z +
            3 * u * u * t * p1.z +
            3 * u * t * t * p2.z +
            t * t * t * p3.z,
        );
      }


      function addFlatStrapSegment(parent, a, b, width, depth, mat) {
        const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.sqrt(dx * dx + dy * dy);
        const piece = makeMesh(
          roundedBox(width, len + 0.035, depth, 0.045, 5),
          mat,
          mid.x,
          mid.y,
          mid.z,
        );
        piece.rotation.z = -Math.atan2(dx, dy);
        parent.add(piece);
        return piece;
      }


      function makeNaturalShoulderStrap(side) {
        const strap = new THREE.Group();
        const zBase = D / 2 + 0.082;
        const strapWidth = 0.205;
        const strapDepth = 0.052;


        const p0 = new THREE.Vector3(side * 0.38, H - 0.2, zBase);
        const p1 = new THREE.Vector3(side * 0.76, H - 0.58, zBase + 0.105);
        const p2 = new THREE.Vector3(side * 0.76, 0.72, zBase + 0.11);
        const p3 = new THREE.Vector3(side * 0.38, 0.27, zBase);


        const samples = [];
        for (let i = 0; i <= 12; i++) {
          samples.push(cubicPoint(p0, p1, p2, p3, i / 12));
        }


        // 안쪽 그림자 끈을 먼저 깔아 등판에서 살짝 떠 있는 느낌을 준다.
        for (let i = 0; i < samples.length - 1; i++) {
          const a = samples[i].clone();
          const b = samples[i + 1].clone();
          a.z -= 0.026;
          b.z -= 0.026;
          addFlatStrapSegment(
            strap,
            a,
            b,
            strapWidth + 0.035,
            0.026,
            matShoulderStrapShadow,
          );
        }


        // 본체 어깨끈: 둥근 줄이 아니라 납작한 패딩 끈처럼 여러 조각을 겹쳐 자연스러운 곡선을 만든다.
        for (let i = 0; i < samples.length - 1; i++) {
          addFlatStrapSegment(
            strap,
            samples[i],
            samples[i + 1],
            strapWidth,
            strapDepth,
            matShoulderStrap,
          );
        }


        const topAnchor = makeMesh(
          roundedBox(0.36, 0.18, 0.06, 0.045, 5),
          matShoulderStrap,
          side * 0.34,
          H - 0.12,
          D / 2 + 0.062,
        );
        topAnchor.rotation.z = side * -0.11;
        strap.add(topAnchor);


        const bottomAnchor = makeMesh(
          roundedBox(0.36, 0.18, 0.06, 0.045, 5),
          matShoulderStrap,
          side * 0.34,
          0.17,
          D / 2 + 0.062,
        );
        bottomAnchor.rotation.z = side * 0.12;
        strap.add(bottomAnchor);


        // 어깨끈 바깥쪽 얇은 파이핑. 기존 백팩 테두리 색과 맞춰 자연스럽게 보이게 한다.
        const outerLine = samples.map(
          (p) => new THREE.Vector3(p.x + side * 0.095, p.y, p.z + 0.012),
        );
        const innerLine = samples.map(
          (p) => new THREE.Vector3(p.x - side * 0.095, p.y, p.z + 0.012),
        );
        strap.add(makeTube(outerLine, 0.011, matShoulderStrapSide));
        strap.add(makeTube(innerLine, 0.011, matShoulderStrapSide));


        const adjuster = new THREE.Mesh(
          new THREE.TorusGeometry(0.064, 0.0075, 8, 28),
          matMetal,
        );
        adjuster.scale.set(0.75, 1.08, 0.2);
        adjuster.rotation.x = Math.PI / 2;
        adjuster.rotation.z = side * 0.16;
        adjuster.position.set(side * 0.44, 0.54, D / 2 + 0.13);
        strap.add(adjuster);


        const shortWebbing = makeTube(
          [
            new THREE.Vector3(side * 0.42, 0.47, D / 2 + 0.11),
            new THREE.Vector3(side * 0.39, 0.32, D / 2 + 0.088),
            new THREE.Vector3(side * 0.34, 0.17, D / 2 + 0.064),
          ],
          0.025,
          matShoulderStrapShadow,
        );
        strap.add(shortWebbing);


        return strap;
      }


      shell.add(makeNaturalShoulderStrap(-1));
      shell.add(makeNaturalShoulderStrap(1));


      const rearTopDepth = D - LID_D;
      const topRear = makeMesh(
        roundedBox(W * 0.98, WALL, rearTopDepth, 0.08),
        matBag,
        0,
        H - WALL / 2,
        -D / 2 + rearTopDepth / 2,
      );
      shell.add(topRear);


      const divider = makeMesh(
        new THREE.BoxGeometry(W - WALL * 2, H - WALL * 2, 0.03),
        matBagSoft,
        0,
        H / 2,
        Z_DIV,
      );
      shell.add(divider);


      const lidGroup = new THREE.Group();
      lidGroup.position.set(0, H, Z_HINGE);
      shell.add(lidGroup);


      const lid = addClick(
        makeMesh(
          roundedBox(W * 0.98, WALL, LID_D, 0.08),
          matBag,
          0,
          -WALL / 2,
          LID_D / 2,
        ),
        'lid',
      );
      lidGroup.add(lid);


      const frontFlapDrop = 0.42;
      const frontFlap = addClick(
        makeMesh(
          roundedBox(W * 0.98, frontFlapDrop, WALL, 0.12, 6),
          matBag,
          0,
          -frontFlapDrop / 2,
          LID_D + WALL / 2,
        ),
        'lid',
      );
      lidGroup.add(frontFlap);


      const matFrontVelcro = new THREE.MeshStandardMaterial({
        color: 0x5b6472,
        roughness: 1.0,
        metalness: 0.0,
      });


      // 덮개 날개(Flap) 안쪽에 부착되는 찍찍이 함수 (흰색 세로선 제거)
      function makeInnerVelcroPatch(x) {
        const patch = new THREE.Group();
        const base = makeMesh(
          roundedBox(0.34, 0.12, 0.014, 0.026),
          matFrontVelcro,
          0,
          0,
          0,
        );
        patch.add(base);


        patch.position.set(x, -frontFlapDrop * 0.58, LID_D - 0.008);
        return patch;
      }


      lidGroup.add(makeInnerVelcroPatch(-W * 0.24));
      lidGroup.add(makeInnerVelcroPatch(W * 0.24));


      // 가방 본체 전면(frontFace)에 부착되는 맞닿는 찍찍이 함수 (흰색 세로선 제거)
      function makeBodyVelcroPatch(x) {
        const patch = new THREE.Group();
        const base = makeMesh(
          roundedBox(0.34, 0.12, 0.014, 0.026),
          matFrontVelcro,
          0,
          0,
          0,
        );
        patch.add(base);


        patch.position.set(x, H - frontFlapDrop * 0.58, D / 2 - 0.006);
        return patch;
      }


      // 본체 전면 양쪽에 찍찍이 배치
      shell.add(makeBodyVelcroPatch(-W * 0.24));
      shell.add(makeBodyVelcroPatch(W * 0.24));


      function makePikachuKeyring() {
        const g = new THREE.Group();
        const yellow = new THREE.MeshStandardMaterial({
          color: 0xffd83d,
          roughness: 0.68,
          metalness: 0.01,
        });
        const black = new THREE.MeshStandardMaterial({
          color: 0x151515,
          roughness: 0.55,
        });
        const red = new THREE.MeshStandardMaterial({
          color: 0xff5a5f,
          roughness: 0.62,
        });
        const metal = new THREE.MeshStandardMaterial({
          color: 0xb8c0c8,
          roughness: 0.34,
          metalness: 0.72,
        });


        const charmLoop = new THREE.Mesh(
          new THREE.TorusGeometry(0.045, 0.006, 10, 24),
          metal,
        );
        charmLoop.rotation.y = Math.PI / 2;
        charmLoop.position.set(0, 0.155, 0);
        g.add(charmLoop);


        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.105, 28, 22),
          yellow,
        );
        head.scale.set(1.02, 0.92, 0.84);
        head.position.set(0, 0.02, 0);
        g.add(head);


        const body = new THREE.Mesh(
          new THREE.SphereGeometry(0.095, 24, 18),
          yellow,
        );
        body.scale.set(0.82, 1.0, 0.7);
        body.position.set(0, -0.14, 0);
        g.add(body);


        function makeEar(sign) {
          const ear = new THREE.Group();
          const base = new THREE.Mesh(
            new THREE.ConeGeometry(0.032, 0.145, 16),
            yellow,
          );
          base.rotation.z = sign * -0.48;
          base.position.set(sign * 0.06, 0.145, 0);
          ear.add(base);


          const tip = new THREE.Mesh(
            new THREE.ConeGeometry(0.022, 0.052, 16),
            black,
          );
          tip.rotation.z = sign * -0.48;
          tip.position.set(sign * 0.088, 0.215, 0);
          ear.add(tip);
          return ear;
        }
        g.add(makeEar(-1), makeEar(1));


        for (const eyeX of [-0.036, 0.036]) {
          const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.01, 12, 12),
            black,
          );
          eye.position.set(eyeX, 0.026, 0.088);
          g.add(eye);
        }


        for (const cheekX of [-0.06, 0.06]) {
          const cheek = new THREE.Mesh(
            new THREE.SphereGeometry(0.015, 12, 10),
            red,
          );
          cheek.scale.set(1.08, 0.72, 0.3);
          cheek.position.set(cheekX, -0.006, 0.09);
          g.add(cheek);
        }


        const mouth = new THREE.Mesh(
          new THREE.TorusGeometry(0.018, 0.003, 8, 14, Math.PI),
          black,
        );
        mouth.rotation.z = Math.PI;
        mouth.position.set(0, -0.026, 0.092);
        g.add(mouth);


        const tailA = makeMesh(
          new THREE.BoxGeometry(0.026, 0.08, 0.014),
          yellow,
          0.095,
          -0.14,
          -0.018,
        );
        tailA.rotation.z = -0.65;
        g.add(tailA);
        const tailB = makeMesh(
          new THREE.BoxGeometry(0.032, 0.095, 0.014),
          yellow,
          0.13,
          -0.075,
          -0.018,
        );
        tailB.rotation.z = 0.55;

          group.position.set(0, y, -D / 2 + BACK_D / 2);
          group.userData.closedX = group.position.x;
          // 맨 아래 서랍은 하나의 통짜 서랍이지만, 위 서랍처럼 앞뒤가 아니라 좌우 방향으로 열린다.
          group.userData.openX = group.position.x + fullW * 0.55;
          group.userData.targetX = group.userData.closedX;
          group.userData.closedZ = group.position.z;
          group.userData.openZ = group.position.z;
          group.userData.targetZ = group.userData.closedZ;


          addGlassWall(group, fullW, 0.022, fullD, 0, -fullH / 2, 0);
          addGlassWall(group, fullW, fullH, 0.022, 0, 0, -fullD / 2);
          addGlassWall(group, fullW, fullH, 0.022, 0, 0, fullD / 2);
          addGlassWall(group, 0.022, fullH, fullD, -fullW / 2, 0, 0);
          addGlassWall(group, 0.022, fullH, fullD, fullW / 2, 0, 0);


          const bottomCushion = makeMesh(
            roundedBox(fullW * 0.92, 0.026, fullD * 0.9, 0.01),
            matCushion,
            0,
            -fullH / 2 + 0.032,
            0,
          );
          group.add(bottomCushion);


          const innerBackCushion = makeMesh(
            roundedBox(fullW * 0.92, fullH * 0.82, 0.026, 0.01),
            matCushion,
            0,
            0,
            fullD / 2 - 0.032,
          );
          group.add(innerBackCushion);


          const sideCushionA = makeMesh(
            roundedBox(0.026, fullH * 0.82, fullD * 0.9, 0.01),
            matCushion,
            -fullW / 2 + 0.032,
            0,
            0,
          );
          group.add(sideCushionA);


          const sideCushionB = makeMesh(
            roundedBox(0.026, fullH * 0.82, fullD * 0.9, 0.01),
            matCushion,
            fullW / 2 - 0.032,
            0,
            0,
          );
          group.add(sideCushionB);


          const drawerHandleColors = [0xf9cf58, 0x8ae2cf, 0xf6a7c1];
          // 맨 아래 통짜 서랍도 양쪽에서 잡을 수 있게 좌우 손잡이를 모두 배치한다.
          [-1, 1].forEach((handleSide) => {
            const handle = addClick(
              makeMesh(
                roundedBox(0.034, 0.22, 0.115, 0.018),
                new THREE.MeshStandardMaterial({
                  color: drawerHandleColors[rowIndex],
                  roughness: 0.72,
                  metalness: 0.03,
                }),
                handleSide * (fullW / 2 + 0.018),
                0,
                -fullD / 2 + 0.06,
              ),
              'drawer',
              rowIndex,
            );
            group.add(handle);
          });


          const proxy = addClick(
            makeMesh(
              new THREE.BoxGeometry(fullW, fullH, fullD),
              new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.001,
              }),
              0,
              0,
              0,
            ),
            'drawer',
            rowIndex,
          );
          group.add(proxy);


          addSingleBottomDrawerContents(group, fullH);


          cabinet.add(group);
          pair.push(group);
          drawerRows.push(pair);
          return;
        }


        for (const side of [-1, 1]) {
          const halfW = (W - WALL * 2) / 2 - 0.135;
          const halfH = drawerH - 0.06;
          const halfD = BACK_D - 0.08;
          const group = new THREE.Group();
          group.position.set(side * (halfW / 2 + 0.07), y, -D / 2 + BACK_D / 2);
          group.userData.closedX = group.position.x;
          group.userData.openX = group.position.x + side * halfW * 0.86;
          group.userData.targetX = group.userData.closedX;
          group.userData.closedZ = group.position.z;
          group.userData.openZ = group.position.z;
          group.userData.targetZ = group.userData.closedZ;


          addGlassWall(group, halfW, 0.022, halfD, 0, -halfH / 2, 0);
          addGlassWall(group, halfW, halfH, 0.022, 0, 0, -halfD / 2);
          addGlassWall(group, halfW, halfH, 0.022, 0, 0, halfD / 2);
          addGlassWall(group, 0.022, halfH, halfD, (halfW / 2) * side, 0, 0);
          addGlassWall(group, 0.022, halfH, halfD, (-halfW / 2) * side, 0, 0);


          const bottomCushion = makeMesh(
            roundedBox(halfW * 0.9, 0.026, halfD * 0.9, 0.01),
            matCushion,
            0,
            -halfH / 2 + 0.032,
            0,
          );
          group.add(bottomCushion);


          const innerBackCushion = makeMesh(
            roundedBox(halfW * 0.9, halfH * 0.82, 0.026, 0.01),
            matCushion,
            0,
            0,
            halfD / 2 - 0.032,
          );
          group.add(innerBackCushion);


          const sideCushionA = makeMesh(
            roundedBox(0.026, halfH * 0.82, halfD * 0.9, 0.01),
            matCushion,
            -halfW / 2 + 0.032,
            0,
            0,
          );
          group.add(sideCushionA);


          const sideCushionB = makeMesh(
            roundedBox(0.026, halfH * 0.82, halfD * 0.9, 0.01),
            matCushion,
            halfW / 2 - 0.032,
            0,
            0,
          );
          group.add(sideCushionB);


          const drawerHandleColors = [0xf9cf58, 0x8ae2cf, 0xf6a7c1];
          const handle = addClick(
            makeMesh(
              roundedBox(0.034, 0.22, 0.115, 0.018),
              new THREE.MeshStandardMaterial({
                color: drawerHandleColors[rowIndex],
                roughness: 0.72,
                metalness: 0.03,
              }),
              side * (halfW / 2 + 0.018),
              0,
              -halfD / 2 + 0.06,
            ),
            'drawer',
            rowIndex,
          );
          group.add(handle);


          const proxy = addClick(
            makeMesh(
              new THREE.BoxGeometry(halfW, halfH, halfD),
              new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.001,
              }),
              0,
              0,
              0,
            ),
            'drawer',
            rowIndex,
          );
          group.add(proxy);


          addDrawerContents(group, rowIndex, side, halfH);


          cabinet.add(group);
          pair.push(group);
        }


        drawerRows.push(pair);
      }


      makeDrawerRow(0);
      makeDrawerRow(1);
      makeDrawerRow(2);


      const books = new THREE.Group();


      function makeBookCoverTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');


        ctx.fillStyle = '#f8f6ef';
        ctx.fillRect(0, 0, canvas.width, canvas.height);


        ctx.fillStyle = '#93c5fd';
        roundRect(ctx, 42, 52, 428, 150, 38);
        ctx.fill();


        ctx.fillStyle = '#2563eb';
        roundRect(ctx, 42, 820, 428, 96, 28);
        ctx.fill();


        ctx.fillStyle = '#111827';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 64px Malgun Gothic, Apple SD Gothic Neo, sans-serif';
        ctx.fillText('초등', 256, 390);
        ctx.fillText('교과서', 256, 480);


        ctx.fillStyle = '#ffffff';
        ctx.font = '700 44px Malgun Gothic, Apple SD Gothic Neo, sans-serif';
        ctx.fillText('1학년', 256, 868);


        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;
        return texture;
      }


      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }


      const singleBook = new THREE.Group();
      const bookW = 1.34;
      const bookH = 2.08;
      const bookD = 0.18;


      const bookBody = makeMesh(
        roundedBox(bookW, bookH, bookD, 0.026),
        new THREE.MeshStandardMaterial({
          color: 0xf7f3e8,
          roughness: 0.84,
          metalness: 0.01,
        }),
        0,
        0,
        0,
      );
      singleBook.add(bookBody);


      const bookPages = makeMesh(
        new THREE.BoxGeometry(bookW * 0.88, bookH * 0.9, bookD * 0.72),
        new THREE.MeshStandardMaterial({
          color: 0xf5f1e8,
          roughness: 0.96,
          metalness: 0,
        }),
        bookW * 0.04,
        0,
        0,
      );
      singleBook.add(bookPages);


      const bookSpine = makeMesh(
        new THREE.BoxGeometry(bookW * 0.13, bookH * 1.01, bookD * 1.05),
        new THREE.MeshStandardMaterial({
          color: 0x2563eb,
          roughness: 0.82,
          metalness: 0.01,
        }),
        -bookW / 2 + bookW * 0.065,
        0,
        0,
      );
      singleBook.add(bookSpine);


      const coverPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(bookW * 0.93, bookH * 0.95),
        new THREE.MeshStandardMaterial({
          map: makeBookCoverTexture(),
          roughness: 0.76,
          metalness: 0.01,
        }),
      );
      coverPlane.position.set(0, 0, bookD / 2 + 0.004);
      singleBook.add(coverPlane);


      singleBook.position.set(0, bookH / 2 + 0.08, Z_DIV + FRONT_D / 2);
      singleBook.rotation.z = -0.025;
      books.add(singleBook);


      shell.add(books);


      function setCover(open) {
        state.coverOpen = open;
      }


      function setLid(open) {
        state.lidOpen = open;
      }


      function setDrawer(index, open) {
        state.drawersOpen[index] = open;
        drawerRows[index].forEach((h) => {
          h.userData.targetX = open ? h.userData.openX : h.userData.closedX;
          h.userData.targetZ = open ? h.userData.openZ : h.userData.closedZ;
        });
      }


      function toggleAction(type, index) {
        if (type === 'cover') setCover(!state.coverOpen);
        if (type === 'lid') setLid(!state.lidOpen);
        if (type === 'drawer') {
          if (!state.coverOpen) setCover(true);
          setDrawer(index, !state.drawersOpen[index]);
        }
      }


      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let down = { x: 0, y: 0 };
      let moved = false;


      renderer.domElement.addEventListener('pointerdown', (e) => {
        down = { x: e.clientX, y: e.clientY };
        moved = false;
      });


      renderer.domElement.addEventListener('pointermove', (e) => {
        if (
          Math.abs(e.clientX - down.x) > 5 ||
          Math.abs(e.clientY - down.y) > 5
        )
          moved = true;
      });


      renderer.domElement.addEventListener('pointerup', (e) => {
        if (moved) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickables, true);
        if (!hits.length) return;
        const obj = hits[0].object;
        toggleAction(obj.userData.type, obj.userData.index);
      });


      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') {
          setCover(false);
          setLid(false);
          for (let i = 0; i < 3; i++) setDrawer(i, false);
        }
      });


      const clock = new THREE.Clock();
      function lerp(a, b, t) {
        return a + (b - a) * Math.min(1, t);
      }


      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const speed = 4.8;


        coverGroup.rotation.x = lerp(
          coverGroup.rotation.x,
          state.coverOpen ? Math.PI * 0.84 : 0,
          dt * speed,
        );
        lidGroup.rotation.x = lerp(
          lidGroup.rotation.x,
          state.lidOpen ? -Math.PI * 0.64 : 0,
          dt * speed,
        );


        drawerRows.forEach((pair) => {
          pair.forEach((h) => {
            h.position.x = lerp(h.position.x, h.userData.targetX, dt * speed);
            h.position.z = lerp(h.position.z, h.userData.targetZ, dt * speed);
          });
        });


        controls.update();
        renderer.render(scene, camera);
      }


      animate();


      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
