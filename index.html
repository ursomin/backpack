<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>backpack_ver0.5</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        cursor: grab;
        user-select: none;
      }

      body:active {
        cursor: grabbing;
      }
      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      const camera = new THREE.PerspectiveCamera(
        42,
        innerWidth / innerHeight,
        0.1,
        100,
      );
      camera.position.set(3.6, 2.45, 4.65);

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('canvas'),
        antialias: true,
        alpha: false,
      });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.target.set(0, 1.34, 0);
      controls.minDistance = 3.4;
      controls.maxDistance = 7.5;

      scene.add(new THREE.HemisphereLight(0xffffff, 0xd6d6d6, 2.25));

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
      keyLight.position.set(4, 5, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 1.1);
      fillLight.position.set(-4, 3, -5);
      scene.add(fillLight);

      const backpack = new THREE.Group();
      backpack.position.y = -1.35;
      scene.add(backpack);

      const W = 2.25;
      const H = 2.95;
      const D = 1.36;
      const WALL = 0.055;
      const FRONT_D = 0.52;
      const BACK_D = D - FRONT_D;
      const Z_DIV = D / 2 - FRONT_D;
      const LID_D = FRONT_D - 0.02;
      const Z_HINGE = D / 2 - LID_D;

      function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function makeCoverPatternTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#9bbcff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff5a8';
        [
          [150, 150, 22],
          [410, 210, 16],
          [760, 160, 20],
          [250, 430, 15],
          [620, 390, 18],
          [850, 500, 15],
          [160, 740, 20],
          [460, 780, 15],
          [760, 820, 19],
        ].forEach(([x, y, r]) => {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
            const b = a + Math.PI / 5;
            const ax = x + Math.cos(a) * r;
            const ay = y + Math.sin(a) * r;
            const bx = x + Math.cos(b) * r * 0.43;
            const by = y + Math.sin(b) * r * 0.43;
            if (i === 0) ctx.moveTo(ax, ay);
            else ctx.lineTo(ax, ay);
            ctx.lineTo(bx, by);
          }
          ctx.closePath();
          ctx.fill();
        });

        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        [
          [250, 290],
          [700, 640],
        ].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x - 38, y, 32, Math.PI * 0.9, Math.PI * 1.9);
          ctx.arc(x, y - 18, 40, Math.PI, Math.PI * 2);
          ctx.arc(x + 42, y, 32, Math.PI * 1.1, Math.PI * 0.1);
          ctx.closePath();
          ctx.fill();
        });

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;
        return texture;
      }

      function makeBadgeTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 768;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff7c2';
        drawRoundedRect(ctx, 10, 10, 748, 236, 52);
        ctx.fill();
        ctx.fillStyle = '#ffd35a';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
          const b = a + Math.PI / 5;
          const ax = 110 + Math.cos(a) * 46;
          const ay = 128 + Math.sin(a) * 46;
          const bx = 110 + Math.cos(b) * 20;
          const by = 128 + Math.sin(b) * 20;
          if (i === 0) ctx.moveTo(ax, ay);
          else ctx.lineTo(ax, ay);
          ctx.lineTo(bx, by);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#31456d';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = '900 72px Arial, sans-serif';
        ctx.fillText('DREAM', 190, 104);
        ctx.font = '700 45px Arial, sans-serif';
        ctx.fillText('BACKPACK', 190, 168);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;
        return texture;
      }

      const coverPatternTex = makeCoverPatternTexture();
      const badgeTex = makeBadgeTexture();

      const matBag = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.92,
        metalness: 0.0,
      });
      const matBagSoft = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.94,
        metalness: 0.0,
      });
      const matPanel = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.92,
        metalness: 0.0,
      });
      const matCushion = new THREE.MeshStandardMaterial({
        color: 0x8d95a5,
        roughness: 0.96,
        metalness: 0.01,
      });
      const matStitch = new THREE.MeshStandardMaterial({
        color: 0xc9dbff,
        roughness: 0.95,
      });
      const matMetal = new THREE.MeshStandardMaterial({
        color: 0xf9cf58,
        roughness: 0.42,
        metalness: 0.18,
      });
      const matCover = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.92,
        metalness: 0.0,
      });

      const matGlass = new THREE.MeshPhysicalMaterial({
        color: 0xdff7ff,
        transparent: true,
        opacity: 0.28,
        roughness: 0.02,
        metalness: 0,
        transmission: 0.92,
        thickness: 0.08,
        ior: 1.45,
        clearcoat: 1,
        clearcoatRoughness: 0.03,
        side: THREE.DoubleSide,
      });

      const matGlassEdge = new THREE.LineBasicMaterial({
        color: 0x8fd8ff,
        transparent: true,
        opacity: 0.86,
      });

      const clickables = [];
      const drawerRows = [];

      const state = {
        coverOpen: false,
        lidOpen: false,
        drawersOpen: [false, false, false],
      };

      function roundedBox(w, h, d, radius = 0.04, segments = 4) {
        return new RoundedBoxGeometry(w, h, d, segments, radius);
      }

      function makeMesh(geo, mat, x = 0, y = 0, z = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        return m;
      }

      function addClick(obj, type, index = null) {
        obj.userData.type = type;
        if (index !== null) obj.userData.index = index;
        clickables.push(obj);
        return obj;
      }

      function makeTube(points, radius, mat, closed = false) {
        const curve = new THREE.CatmullRomCurve3(points, closed);
        return new THREE.Mesh(
          new THREE.TubeGeometry(curve, 80, radius, 12, closed),
          mat,
        );
      }

      function addEdges(target, colorMat = matGlassEdge) {
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(target.geometry),
          colorMat,
        );
        edges.position.copy(target.position);
        edges.rotation.copy(target.rotation);
        edges.scale.copy(target.scale);
        target.parent.add(edges);
        return edges;
      }

      const shell = new THREE.Group();
      backpack.add(shell);

      const bottom = makeMesh(
        roundedBox(W * 0.98, WALL, D * 0.98, 0.06),
        matBag,
        0,
        WALL / 2,
        0,
      );
      shell.add(bottom);

      const frontSideDepth = FRONT_D;
      const frontSideZ = Z_DIV + FRONT_D / 2;
      const leftSide = makeMesh(
        roundedBox(WALL, H, frontSideDepth, 0.06),
        matBag,
        -W / 2 + WALL / 2,
        H / 2,
        frontSideZ,
      );
      const rightSide = makeMesh(
        roundedBox(WALL, H, frontSideDepth, 0.06),
        matBag,
        W / 2 - WALL / 2,
        H / 2,
        frontSideZ,
      );
      shell.add(leftSide, rightSide);

      const frontFace = addClick(
        makeMesh(
          roundedBox(W * 0.98, H, WALL, 0.16, 6),
          matBag,
          0,
          H / 2,
          D / 2 - WALL / 2,
        ),
        'lid',
      );
      shell.add(frontFace);

      const frontEdgeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.9,
        metalness: 0.0,
      });
      const frontLeftPiping = makeMesh(
        roundedBox(0.045, H * 0.96, 0.045, 0.022),
        frontEdgeMat,
        -W / 2 + 0.02,
        H / 2,
        D / 2 + 0.012,
      );
      const frontRightPiping = makeMesh(
        roundedBox(0.045, H * 0.96, 0.045, 0.022),
        frontEdgeMat,
        W / 2 - 0.02,
        H / 2,
        D / 2 + 0.012,
      );
      const frontBottomPiping = makeMesh(
        roundedBox(W * 0.94, 0.045, 0.045, 0.022),
        frontEdgeMat,
        0,
        0.045,
        D / 2 + 0.012,
      );
      shell.add(frontLeftPiping, frontRightPiping, frontBottomPiping);

      function makeShoulderStrap(sign) {
        const strap = new THREE.Group();
        const fabricMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          map: coverPatternTex,
          roughness: 0.95,
          metalness: 0.0,
          side: THREE.DoubleSide,
        });
        const frontZ = D / 2 + 0.034;
        const strapWidth = 0.18;
        const strapDepth = 0.026;
        const topY = H - 0.54;

        const centerPoints = [
          new THREE.Vector3(sign * 0.54, topY, frontZ + 0.012),
          new THREE.Vector3(sign * 0.72, 2.02, frontZ + 0.19),
          new THREE.Vector3(sign * 0.76, 1.18, frontZ + 0.24),
          new THREE.Vector3(sign * 0.58, 0.46, frontZ + 0.012),
        ];

        function makeFabricRibbon(points, width, depth, mat) {
          const curve = new THREE.CatmullRomCurve3(points);
          const sampled = curve.getPoints(42);
          const vertices = [];
          const uvs = [];
          const indices = [];

          sampled.forEach((point, i) => {
            const prev = sampled[Math.max(0, i - 1)];
            const next = sampled[Math.min(sampled.length - 1, i + 1)];
            const tx = next.x - prev.x;
            const ty = next.y - prev.y;
            const len = Math.hypot(tx, ty) || 1;
            const nx = (-ty / len) * (width / 2);
            const ny = (tx / len) * (width / 2);
            const sideA = new THREE.Vector3(nx, ny, depth / 2);
            const sideB = new THREE.Vector3(-nx, -ny, depth / 2);
            const sideC = new THREE.Vector3(nx, ny, -depth / 2);
            const sideD = new THREE.Vector3(-nx, -ny, -depth / 2);

            [sideA, sideB, sideC, sideD].forEach((offset) => {
              vertices.push(point.x + offset.x, point.y + offset.y, point.z + offset.z);
            });

            const v = i / (sampled.length - 1);
            uvs.push(0, v, 1, v, 0, v, 1, v);
          });

          for (let i = 0; i < sampled.length - 1; i++) {
            const a = i * 4;
            const b = a + 4;
            indices.push(a, b, a + 1, a + 1, b, b + 1);
            indices.push(a + 2, a + 3, b + 2, a + 3, b + 3, b + 2);
            indices.push(a, a + 2, b, a + 2, b + 2, b);
            indices.push(a + 1, b + 1, a + 3, a + 3, b + 1, b + 3);
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(vertices, 3),
          );
          geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
          geometry.setIndex(indices);
          geometry.computeVertexNormals();
          return new THREE.Mesh(geometry, mat);
        }

        const ribbon = makeFabricRibbon(
          centerPoints,
          strapWidth,
          strapDepth,
          fabricMat,
        );
        strap.add(ribbon);

        function tangentRotation(from, to) {
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          let rotation = Math.atan2(-dx, dy);
          if (rotation > Math.PI / 2) rotation -= Math.PI;
          if (rotation < -Math.PI / 2) rotation += Math.PI;
          return rotation;
        }

        function addFabricAnchor(point, neighbor) {
          const anchorW = strapWidth * 1.22;
          const anchorH = 0.28;
          const shape = new THREE.Shape();
          shape.moveTo(0, anchorH / 2);
          shape.bezierCurveTo(
            anchorW * 0.44,
            anchorH * 0.34,
            anchorW * 0.52,
            -anchorH * 0.18,
            anchorW * 0.28,
            -anchorH / 2,
          );
          shape.quadraticCurveTo(0, -anchorH * 0.62, -anchorW * 0.28, -anchorH / 2);
          shape.bezierCurveTo(
            -anchorW * 0.52,
            -anchorH * 0.18,
            -anchorW * 0.44,
            anchorH * 0.34,
            0,
            anchorH / 2,
          );

          const anchorGeometry = new THREE.ExtrudeGeometry(shape, {
            depth: strapDepth * 0.82,
            bevelEnabled: true,
            bevelSize: 0.008,
            bevelThickness: 0.006,
            bevelSegments: 3,
          });
          anchorGeometry.translate(0, 0, (-strapDepth * 0.82) / 2);

          const anchor = new THREE.Mesh(anchorGeometry, fabricMat);
          anchor.position.set(point.x, point.y, frontZ + 0.004);
          anchor.rotation.z = tangentRotation(point, neighbor);
          strap.add(anchor);
        }

        addFabricAnchor(centerPoints[0], centerPoints[1]);
        addFabricAnchor(centerPoints[3], centerPoints[2]);

        return strap;
      }

      shell.add(makeShoulderStrap(-1));
      shell.add(makeShoulderStrap(1));

      const rearTopDepth = D - LID_D;
      const topRear = makeMesh(
        roundedBox(W * 0.98, WALL, rearTopDepth, 0.08),
        matBag,
        0,
        H - WALL / 2,
        -D / 2 + rearTopDepth / 2,
      );
      shell.add(topRear);

      const divider = makeMesh(
        new THREE.BoxGeometry(W - WALL * 2, H - WALL * 2, 0.03),
        matBagSoft,
        0,
        H / 2,
        Z_DIV,
      );
      shell.add(divider);

      const lidGroup = new THREE.Group();
      lidGroup.position.set(0, H, Z_HINGE);
      shell.add(lidGroup);

      const lid = addClick(
        makeMesh(
          roundedBox(W * 0.98, WALL, LID_D, 0.08),
          matBag,
          0,
          -WALL / 2,
          LID_D / 2,
        ),
        'lid',
      );
      lidGroup.add(lid);

      const frontFlapDrop = 0.42;
      const frontFlap = addClick(
        makeMesh(
          roundedBox(W * 0.98, frontFlapDrop, WALL, 0.12, 6),
          matBag,
          0,
          -frontFlapDrop / 2,
          LID_D + WALL / 2,
        ),
        'lid',
      );
      lidGroup.add(frontFlap);

      const matFrontVelcro = new THREE.MeshStandardMaterial({
        color: 0x5b6472,
        roughness: 1.0,
        metalness: 0.0,
      });

      // 덮개 날개(Flap) 안쪽에 부착되는 찍찍이 함수 (흰색 세로선 제거)
      function makeInnerVelcroPatch(x) {
        const patch = new THREE.Group();
        const base = makeMesh(
          roundedBox(0.34, 0.12, 0.014, 0.026),
          matFrontVelcro,
          0,
          0,
          0,
        );
        patch.add(base);

        patch.position.set(x, -frontFlapDrop * 0.58, LID_D - 0.008);
        return patch;
      }

      lidGroup.add(makeInnerVelcroPatch(-W * 0.24));
      lidGroup.add(makeInnerVelcroPatch(W * 0.24));

      // 가방 본체 전면(frontFace)에 부착되는 맞닿는 찍찍이 함수 (흰색 세로선 제거)
      function makeBodyVelcroPatch(x) {
        const patch = new THREE.Group();
        const base = makeMesh(
          roundedBox(0.34, 0.12, 0.014, 0.026),
          matFrontVelcro,
          0,
          0,
          0,
        );
        patch.add(base);

        patch.position.set(x, H - frontFlapDrop * 0.58, D / 2 - 0.006);
        return patch;
      }

      // 본체 전면 양쪽에 찍찍이 배치
      shell.add(makeBodyVelcroPatch(-W * 0.24));
      shell.add(makeBodyVelcroPatch(W * 0.24));

      function makePikachuKeyring() {
        const g = new THREE.Group();
        const yellow = new THREE.MeshStandardMaterial({
          color: 0xffd83d,
          roughness: 0.68,
          metalness: 0.01,
        });
        const black = new THREE.MeshStandardMaterial({
          color: 0x151515,
          roughness: 0.55,
        });
        const red = new THREE.MeshStandardMaterial({
          color: 0xff5a5f,
          roughness: 0.62,
        });
        const metal = new THREE.MeshStandardMaterial({
          color: 0xb8c0c8,
          roughness: 0.34,
          metalness: 0.72,
        });

        const charmLoop = new THREE.Mesh(
          new THREE.TorusGeometry(0.045, 0.006, 10, 24),
          metal,
        );
        charmLoop.rotation.y = Math.PI / 2;
        charmLoop.position.set(0, 0.155, 0);
        g.add(charmLoop);

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.105, 28, 22),
          yellow,
        );
        head.scale.set(1.02, 0.92, 0.84);
        head.position.set(0, 0.02, 0);
        g.add(head);

        const body = new THREE.Mesh(
          new THREE.SphereGeometry(0.095, 24, 18),
          yellow,
        );
        body.scale.set(0.82, 1.0, 0.7);
        body.position.set(0, -0.14, 0);
        g.add(body);

        function makeEar(sign) {
          const ear = new THREE.Group();
          const base = new THREE.Mesh(
            new THREE.ConeGeometry(0.032, 0.145, 16),
            yellow,
          );
          base.rotation.z = sign * -0.48;
          base.position.set(sign * 0.06, 0.145, 0);
          ear.add(base);

          const tip = new THREE.Mesh(
            new THREE.ConeGeometry(0.022, 0.052, 16),
            black,
          );
          tip.rotation.z = sign * -0.48;
          tip.position.set(sign * 0.088, 0.215, 0);
          ear.add(tip);
          return ear;
        }
        g.add(makeEar(-1), makeEar(1));

        for (const eyeX of [-0.036, 0.036]) {
          const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.01, 12, 12),
            black,
          );
          eye.position.set(eyeX, 0.026, 0.088);
          g.add(eye);
        }

        for (const cheekX of [-0.06, 0.06]) {
          const cheek = new THREE.Mesh(
            new THREE.SphereGeometry(0.015, 12, 10),
            red,
          );
          cheek.scale.set(1.08, 0.72, 0.3);
          cheek.position.set(cheekX, -0.006, 0.09);
          g.add(cheek);
        }

        const mouth = new THREE.Mesh(
          new THREE.TorusGeometry(0.018, 0.003, 8, 14, Math.PI),
          black,
        );
        mouth.rotation.z = Math.PI;
        mouth.position.set(0, -0.026, 0.092);
        g.add(mouth);

        const tailA = makeMesh(
          new THREE.BoxGeometry(0.026, 0.08, 0.014),
          yellow,
          0.095,
          -0.14,
          -0.018,
        );
        tailA.rotation.z = -0.65;
        g.add(tailA);
        const tailB = makeMesh(
          new THREE.BoxGeometry(0.032, 0.095, 0.014),
          yellow,
          0.13,
          -0.075,
          -0.018,
        );
        tailB.rotation.z = 0.55;
        g.add(tailB);

        g.scale.setScalar(0.66);
        return g;
      }

      const keyringHook = new THREE.Group();
      const hookMat = new THREE.MeshStandardMaterial({
        color: 0xb8c0c8,
        roughness: 0.34,
        metalness: 0.72,
      });
      const tabMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.9,
        metalness: 0.0,
      });
      const sideX = W / 2 + 0.006;
      const sideY = H * 0.64;
      const sideZ = frontSideZ + 0.045;

      const fabricTab = makeMesh(
        roundedBox(0.035, 0.24, 0.105, 0.018),
        tabMat,
        sideX,
        sideY,
        sideZ,
      );
      fabricTab.rotation.z = 0.02;
      keyringHook.add(fabricTab);

      const dRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.075, 0.009, 12, 32),
        hookMat,
      );
      dRing.rotation.y = Math.PI / 2;
      dRing.position.set(W / 2 + 0.035, sideY - 0.13, sideZ);
      keyringHook.add(dRing);

      const connector = new THREE.Mesh(
        new THREE.TorusGeometry(0.04, 0.0065, 10, 24),
        hookMat,
      );
      connector.rotation.y = Math.PI / 2;
      connector.position.set(W / 2 + 0.042, sideY - 0.235, sideZ);
      keyringHook.add(connector);

      const pikaKeyring = makePikachuKeyring();
      pikaKeyring.position.set(W / 2 + 0.048, sideY - 0.405, sideZ);
      pikaKeyring.rotation.y = -Math.PI / 2;
      pikaKeyring.rotation.z = -0.03;
      keyringHook.add(pikaKeyring);
      backpack.add(keyringHook);

      // 키링이 달린 앞쪽 수납부의 아래 양옆에 단순한 천 주머니형 물병꽂이를 추가한다.
      // 장식 요소 없이 천 포켓 몸체만 남기고, 윗부분은 열린 입구로 둔다.
      const matBottlePocket = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.95,
        metalness: 0.0,
      });

      function makeBottlePocket(side) {
        const pocket = new THREE.Group();
        const pocketH = 0.72;
        const pocketD = 0.52;
        const pocketOut = 0.17;
        const fabricT = 0.026;

        // 바깥 천 면: 옆면에서 살짝 튀어나온 주머니의 가장 넓은 면이다.
        const outerPanel = makeMesh(
          roundedBox(fabricT, pocketH, pocketD, 0.075, 6),
          matBottlePocket,
          side * (pocketOut / 2),
          0,
          0,
        );
        pocket.add(outerPanel);

        // 앞뒤 천 면: 바깥 천 면과 가방 옆면을 이어 주되 위쪽은 막지 않는다.
        [-1, 1].forEach((zSide) => {
          const sidePanel = makeMesh(
            roundedBox(pocketOut, pocketH, fabricT, 0.045, 5),
            matBottlePocket,
            0,
            0,
            zSide * (pocketD / 2 - fabricT / 2),
          );
          pocket.add(sidePanel);
        });

        // 바닥 천 면: 물병이 아래로 빠지지 않도록 주머니 몸체의 일부로만 만든다.
        const bottomPanel = makeMesh(
          roundedBox(pocketOut, fabricT, pocketD, 0.045, 5),
          matBottlePocket,
          0,
          -pocketH / 2 + fabricT / 2,
          0,
        );
        pocket.add(bottomPanel);

        // 윗부분에는 아무 오브젝트도 추가하지 않아 물병을 넣을 수 있는 열린 입구로 둔다.
        // 좌우 대칭 배치. 오른쪽은 기존 키링보다 낮게 두어 서로 겹치지 않게 한다.
        pocket.position.set(
          side * (W / 2 + pocketOut / 2 - 0.008),
          0.54,
          frontSideZ + 0.01,
        );
        pocket.rotation.z = side * -0.015;
        return pocket;
      }

      shell.add(makeBottlePocket(-1));
      shell.add(makeBottlePocket(1));

      const coverGroup = new THREE.Group();
      // 서랍쪽 커버는 아래쪽을 회전축으로 삼아 아래로 열린다.
      coverGroup.position.set(0, 0, -D / 2);
      backpack.add(coverGroup);

      const rearFoldDepth = 0.44;
      const rearCoverH = H;

      const cover = addClick(
        makeMesh(
          roundedBox(W * 0.98, rearCoverH, WALL, 0.16, 6),
          matCover,
          0,
          rearCoverH / 2,
          WALL / 2,
        ),
        'cover',
      );
      coverGroup.add(cover);

      const rearSideDepth = BACK_D + 0.02;
      const rearSideZ = rearSideDepth / 2;
      const coverSideLeft = addClick(
        makeMesh(
          roundedBox(WALL, rearCoverH, rearSideDepth, 0.06),
          matCover,
          -W / 2 + WALL / 2,
          rearCoverH / 2,
          rearSideZ,
        ),
        'cover',
      );
      const coverSideRight = addClick(
        makeMesh(
          roundedBox(WALL, rearCoverH, rearSideDepth, 0.06),
          matCover,
          W / 2 - WALL / 2,
          rearCoverH / 2,
          rearSideZ,
        ),
        'cover',
      );
      coverGroup.add(coverSideLeft, coverSideRight);

      const rearEdgeMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: coverPatternTex,
        roughness: 0.9,
        metalness: 0.0,
      });
      const rearLeftPiping = makeMesh(
        roundedBox(0.045, rearCoverH * 0.96, 0.045, 0.022),
        rearEdgeMat,
        -W / 2 + 0.02,
        rearCoverH / 2,
        WALL + 0.012,
      );
      const rearRightPiping = makeMesh(
        roundedBox(0.045, rearCoverH * 0.96, 0.045, 0.022),
        rearEdgeMat,
        W / 2 - 0.02,
        rearCoverH / 2,
        WALL + 0.012,
      );
      const rearTopPiping = makeMesh(
        roundedBox(W * 0.94, 0.045, 0.045, 0.022),
        rearEdgeMat,
        0,
        rearCoverH - 0.045,
        WALL + 0.012,
      );
      const rearBottomPiping = makeMesh(
        roundedBox(W * 0.94, 0.045, 0.045, 0.022),
        rearEdgeMat,
        0,
        0.045,
        WALL + 0.012,
      );
      coverGroup.add(
        rearLeftPiping,
        rearRightPiping,
        rearTopPiping,
        rearBottomPiping,
      );

      const rearUpperWrapDepth = 0.2;
      const rearUpperWrapHeight = 0.36;

      const rearBottomWrap = makeMesh(
        roundedBox(W * 1.02, WALL, rearUpperWrapDepth, 0.05),
        matCover,
        0,
        WALL / 2,
        WALL / 2 + rearUpperWrapDepth / 2,
      );
      coverGroup.add(rearBottomWrap);

      const rearTopFold = addClick(
        makeMesh(
          roundedBox(W * 0.98, rearFoldDepth, WALL, 0.13, 6),
          matCover,
          0,
          H + WALL / 2,
          WALL / 2 + rearFoldDepth / 2,
        ),
        'cover',
      );

      const rearTopFoldEdge = makeMesh(
        roundedBox(W * 0.94, 0.04, 0.04, 0.02),
        rearEdgeMat,
        0,
        H + WALL / 2,
        WALL / 2 + rearFoldDepth - 0.02,
      );
      rearTopFoldEdge.rotation.x = Math.PI / 2;
      coverGroup.add(rearTopFoldEdge);
      rearTopFold.rotation.x = Math.PI / 2;
      coverGroup.add(rearTopFold);

      // 위로 접히는 잠금 날개와 본체 상단에 맞물리는 벨크로 패치 함수 (흰색 세로선 제거)
      function makeFoldVelcroPatch(x, localY, localZ, parentGroup) {
        const patch = new THREE.Group();
        const base = makeMesh(
          roundedBox(0.42, 0.13, 0.014, 0.028),
          matFrontVelcro,
          0,
          0,
          0,
        );
        patch.add(base);

        patch.rotation.x = Math.PI / 2;
        patch.position.set(x, localY, localZ);
        parentGroup.add(patch);
        return patch;
      }

      // 커버 쪽 벨크로: 이제 커버의 아래쪽이 아니라 위쪽 접힘 날개에 붙는다.
      makeFoldVelcroPatch(
        -W * 0.24,
        H + 0.006,
        WALL / 2 + rearFoldDepth * 0.58,
        coverGroup,
      );
      makeFoldVelcroPatch(
        W * 0.24,
        H + 0.006,
        WALL / 2 + rearFoldDepth * 0.58,
        coverGroup,
      );

      // 본체 쪽 벨크로: 커버가 아래로 열리므로 상단 후면 쪽에 맞물리게 배치한다.
      makeFoldVelcroPatch(
        -W * 0.24,
        H + 0.008,
        -D / 2 + WALL / 2 + rearFoldDepth * 0.58,
        shell,
      );
      makeFoldVelcroPatch(
        W * 0.24,
        H + 0.008,
        -D / 2 + WALL / 2 + rearFoldDepth * 0.58,
        shell,
      );

      const cabinet = new THREE.Group();
      shell.add(cabinet);

      const drawerH = (H - WALL * 2) / 3;

      for (let i = 1; i < 3; i++) {
        cabinet.add(
          makeMesh(
            new THREE.BoxGeometry(W - WALL * 2, 0.035, BACK_D - 0.04),
            matPanel,
            0,
            WALL + i * drawerH,
            -D / 2 + BACK_D / 2,
          ),
        );
      }

      const upperDividerH = H - WALL * 2 - drawerH;
      cabinet.add(
        makeMesh(
          new THREE.BoxGeometry(0.035, upperDividerH, BACK_D - 0.04),
          matPanel,
          0,
          WALL + drawerH + upperDividerH / 2,
          -D / 2 + BACK_D / 2,
        ),
      );

      function addGlassWall(parent, w, h, d, x, y, z) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matGlass);
        wall.position.set(x, y, z);
        parent.add(wall);

        const edge = new THREE.LineSegments(
          new THREE.EdgesGeometry(wall.geometry),
          matGlassEdge,
        );
        edge.position.copy(wall.position);
        parent.add(edge);
        return wall;
      }

      function makePencil() {
        const g = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.022, 0.022, 0.42, 16),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.55 }),
        );
        body.rotation.z = Math.PI / 2;
        g.add(body);

        const tip = new THREE.Mesh(
          new THREE.ConeGeometry(0.024, 0.075, 16),
          new THREE.MeshStandardMaterial({ color: 0xd6b08a, roughness: 0.7 }),

        tip.rotation.z = -Math.PI / 2;
        tip.position.x = 0.245;
        g.add(tip);

        const lead = new THREE.Mesh(
          new THREE.ConeGeometry(0.012, 0.035, 12),
          new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 }),
        );
        lead.rotation.z = -Math.PI / 2;
        lead.position.x = 0.298;
        g.add(lead);

        const eraser = makeMesh(
          new THREE.BoxGeometry(0.055, 0.045, 0.045),
          new THREE.MeshStandardMaterial({ color: 0xf9a8d4, roughness: 0.65 }),

        const g = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.032, 0.032, 0.44, 18),
          new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 }),

        body.rotation.x = Math.PI / 2;

        const capA = new THREE.Mesh(
          new THREE.CylinderGeometry(0.036, 0.036, 0.08, 18),
          new THREE.MeshStandardMaterial({ color, roughness: 0.48 }),

        g.add(capA);

        const capB = capA.clone();
        capB.position.z = -0.245;
        g.add(capB);
        return g;
      }

      function makeBallpointPen() {
        const g = new THREE.Group();
        const blue = new THREE.MeshStandardMaterial({
          color: 0x2563eb,
          roughness: 0.5,
          metalness: 0.02,
        });
        const white = new THREE.MeshStandardMaterial({
          color: 0xf8fafc,

          metalness: 0.01,
        });
        const metal = new THREE.MeshStandardMaterial({
          color: 0xcbd5e1,
          roughness: 0.34,

        });

        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.018, 0.018, 0.52, 16),
          white,
        );
        body.rotation.z = Math.PI / 2;
        g.add(body);

        const grip = new THREE.Mesh(
          new THREE.CylinderGeometry(0.021, 0.021, 0.12, 16),

        );
        grip.rotation.z = Math.PI / 2;

      function makeRuler() {
        const g = new THREE.Group();
        const rulerMat = new THREE.MeshStandardMaterial({
          color: 0xfef08a,
          transparent: true,
          opacity: 0.82,
          roughness: 0.42,
          metalness: 0.0,
        });
        const lineMat = new THREE.MeshStandardMaterial({
          color: 0x334155,
          roughness: 0.5,
        });

        const body = makeMesh(
          roundedBox(0.64, 0.026, 0.115, 0.012),
          rulerMat,
          0,
          0,
          0,
        );
        g.add(body);

        for (let i = 0; i <= 10; i++) {
          const tickH = i % 5 === 0 ? 0.085 : i % 2 === 0 ? 0.065 : 0.045;
          const tick = makeMesh(
            new THREE.BoxGeometry(0.006, 0.006, tickH),
            lineMat,
            -0.29 + i * 0.058,
            0.018,
            -0.025,
          );
          g.add(tick);
        }

        return g;
      }

      function makeScissors() {

        });
        const bladeMat = new THREE.MeshStandardMaterial({
          color: 0xd1d5db,

        const pivotMat = new THREE.MeshStandardMaterial({
          color: 0x94a3b8,

          metalness: 0.6,
        });

        const handleL = new THREE.Mesh(
          new THREE.TorusGeometry(0.045, 0.008, 10, 24),

        handleL.rotation.x = Math.PI / 2;
        handleL.scale.set(1.18, 0.78, 1);
        handleL.position.set(-0.045, 0.02, -0.12);
        g.add(handleL);

        const handleR = handleL.clone();
        handleR.position.x = 0.045;

        const neckL = makeMesh(
          new THREE.BoxGeometry(0.018, 0.012, 0.13),

        neckL.rotation.y = -0.18;
        g.add(neckL);

        const neckR = makeMesh(
          new THREE.BoxGeometry(0.018, 0.012, 0.13),

        neckR.rotation.y = 0.18;
        g.add(neckR);

        const bladeL = makeMesh(
          new THREE.BoxGeometry(0.026, 0.012, 0.28),

        bladeL.rotation.y = 0.18;
        g.add(bladeL);

        const bladeR = makeMesh(

        bladeR.rotation.y = -0.18;

      function makeAirPods() {
        const g = new THREE.Group();
        const white = new THREE.MeshStandardMaterial({
          color: 0xf8fafc,
          roughness: 0.42,
          metalness: 0.02,
        });
        const silver = new THREE.MeshStandardMaterial({
          color: 0xd1d5db,

        const lidLine = makeMesh(
          new THREE.BoxGeometry(0.29, 0.012, 0.185),

        g.add(lidLine);

        // 에어팟 케이스 위의 이어버드 모양 장식은 제거하고 케이스만 남김

        return g;
      }

      function makeOctopusDoll() {
        const g = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({
          color: 0xf9a8d4,
          roughness: 0.74,
          metalness: 0.01,
        });
        const blushMat = new THREE.MeshStandardMaterial({
          color: 0xfb7185,
          roughness: 0.75,
        });
        const eyeMat = new THREE.MeshStandardMaterial({
          color: 0x111111,
          roughness: 0.45,
        });
        const whiteMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          roughness: 0.55,
        });

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.15, 28, 22),
          bodyMat,
        );
        head.scale.y = 0.9;
        head.position.y = 0.12;
        g.add(head);

        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI * 2 * i) / 6;
          const tentacle = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 16, 12),
            bodyMat,
          );
          tentacle.scale.set(1.15, 0.65, 1.15);
          tentacle.position.set(
            Math.cos(angle) * 0.12,
            -0.03,
            Math.sin(angle) * 0.1,
          );
          g.add(tentacle);
        }

        const eyeL = new THREE.Mesh(
          new THREE.SphereGeometry(0.018, 12, 12),
          eyeMat,
        );
        eyeL.position.set(-0.055, 0.16, 0.13);
        g.add(eyeL);
        const eyeR = eyeL.clone();
        eyeR.position.x = 0.055;
        g.add(eyeR);

        const shineL = new THREE.Mesh(
          new THREE.SphereGeometry(0.006, 8, 8),
          whiteMat,
        );
        shineL.position.set(-0.049, 0.168, 0.144);
        g.add(shineL);
        const shineR = shineL.clone();
        shineR.position.x = 0.061;
        g.add(shineR);

        const cheekL = new THREE.Mesh(
          new THREE.SphereGeometry(0.018, 12, 8),
          blushMat,
        );
        cheekL.scale.set(1.25, 0.55, 0.35);
        cheekL.position.set(-0.085, 0.125, 0.136);
        g.add(cheekL);
        const cheekR = cheekL.clone();
        cheekR.position.x = 0.085;
        g.add(cheekR);

        g.scale.setScalar(1.08);
        return g;
      }

      function addDrawerContents(group, rowIndex, side, halfH) {
        const bottomY = -halfH / 2 + 0.065;

        if (rowIndex === 0 && side === 1) {
          const airPods = makeAirPods();
          airPods.position.set(0, bottomY + 0.085, 0);
          airPods.rotation.y = -0.16;
          group.add(airPods);
          return;
        }

        if (rowIndex === 1 && side === 1) {
          const octopus = makeOctopusDoll();
          octopus.position.set(0, bottomY + 0.14, 0.02);
          octopus.rotation.y = -0.08;
          group.add(octopus);
          return;
        }

        if (rowIndex === 2 && side === -1) {
          const airPods = makeAirPods();
          airPods.position.set(0, bottomY + 0.09, 0.02);
          airPods.rotation.y = -0.16;
          group.add(airPods);
          return;
        }

        if (rowIndex === 0) {
          const pencil1 = makePencil();
          pencil1.position.set(-side * 0.08, bottomY, -0.18);
          pencil1.rotation.y = 0.12;
          group.add(pencil1);

          const pencil2 = makePencil();
          pencil2.position.set(side * 0.08, bottomY + 0.035, 0.08);
          pencil2.rotation.y = -0.1;
          pencil2.rotation.z = 0.05;
          group.add(pencil2);

          const eraser = makeMesh(
            roundedBox(0.16, 0.07, 0.1, 0.018),
            new THREE.MeshStandardMaterial({
              color: 0xfca5a5,
              roughness: 0.65,
            }),
            side * 0.18,
            bottomY + 0.005,
            0.22,
          );
          group.add(eraser);
        }

        if (rowIndex === 1) {
          const colors = [0xef4444, 0x22c55e, 0x3b82f6, 0xf59e0b, 0xa855f7];
          colors.forEach((color, i) => {
            const marker = makeMarker(color);
            marker.position.set(-0.22 + i * 0.11, bottomY + i * 0.008, -0.02);
            marker.rotation.y = 0.05 * side;
            group.add(marker);
          });
        }

        if (rowIndex === 2) {
          const tray = makeMesh(
            roundedBox(0.52, 0.045, 0.34, 0.025),
            new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.7 }),
            0,
            bottomY - 0.005,
            0,
          );
          group.add(tray);

          const paintColors = [
            0xef4444, 0xfacc15, 0x22c55e, 0x3b82f6, 0xa855f7, 0xf97316,
          ];
          paintColors.forEach((color, i) => {
            const paint = new THREE.Mesh(
              new THREE.CylinderGeometry(0.04, 0.04, 0.018, 18),
              new THREE.MeshStandardMaterial({ color, roughness: 0.35 }),
            );
            paint.rotation.x = Math.PI / 2;
            paint.position.set(
              -0.2 + (i % 3) * 0.2,
              bottomY + 0.035,
              -0.09 + Math.floor(i / 3) * 0.18,
            );
            group.add(paint);
          });

          const tube = makePaintTube(0x60a5fa);
          tube.position.set(0.16, bottomY + 0.075, 0.2);
          tube.rotation.y = -0.25;
          group.add(tube);
        }
      }

      function addSingleBottomDrawerContents(group, halfH) {
        const bottomY = -halfH / 2 + 0.065;

        const pencil1 = makePencil();
        pencil1.position.set(-0.46, bottomY + 0.01, -0.18);
        pencil1.rotation.y = 0.12;
        group.add(pencil1);

        const pencil2 = makePencil();
        pencil2.position.set(-0.26, bottomY + 0.045, 0.08);
        pencil2.rotation.y = -0.1;
        pencil2.rotation.z = 0.05;
        group.add(pencil2);

        const eraser = makeMesh(
          roundedBox(0.16, 0.07, 0.1, 0.018),
          new THREE.MeshStandardMaterial({
            color: 0xfca5a5,
            roughness: 0.65,
          }),
          -0.66,
          bottomY + 0.01,
          0.22,
        );
        group.add(eraser);

        const ruler = makeRuler();
        ruler.position.set(0.25, bottomY + 0.02, -0.22);
        ruler.rotation.y = -0.08;
        group.add(ruler);

        const pen = makeBallpointPen();
        pen.position.set(0.33, bottomY + 0.055, 0.16);
        pen.rotation.y = 0.12;
        pen.rotation.z = -0.03;
        group.add(pen);

        const scissors = makeScissors();
        scissors.position.set(0.68, bottomY + 0.035, -0.02);
        scissors.rotation.y = -0.08;
        scissors.rotation.z = 0.03;
        group.add(scissors);
      }

      function makeDrawerRow(rowIndex) {
        const pair = [];
        const y = WALL + drawerH * (rowIndex + 0.5);

        if (rowIndex === 0) {
          const fullW = W - WALL * 2 - 0.16;
          const fullH = drawerH - 0.06;
          const fullD = BACK_D - 0.08;
          const group = new THREE.Group();
          group.position.set(0, y, -D / 2 + BACK_D / 2);
          group.userData.closedX = group.position.x;
          // 맨 아래 서랍은 하나의 통짜 서랍이지만, 위 서랍처럼 앞뒤가 아니라 좌우 방향으로 열린다.
          group.userData.openX = group.position.x + fullW * 0.55;
          group.userData.targetX = group.userData.closedX;
          group.userData.closedZ = group.position.z;
          group.userData.openZ = group.position.z;
          group.userData.targetZ = group.userData.closedZ;

          addGlassWall(group, fullW, 0.022, fullD, 0, -fullH / 2, 0);
          addGlassWall(group, fullW, fullH, 0.022, 0, 0, -fullD / 2);
          addGlassWall(group, fullW, fullH, 0.022, 0, 0, fullD / 2);
          addGlassWall(group, 0.022, fullH, fullD, -fullW / 2, 0, 0);
          addGlassWall(group, 0.022, fullH, fullD, fullW / 2, 0, 0);

          const bottomCushion = makeMesh(
            roundedBox(fullW * 0.92, 0.026, fullD * 0.9, 0.01),
            matCushion,
            0,
            -fullH / 2 + 0.032,
            0,
          );
          group.add(bottomCushion);

          const innerBackCushion = makeMesh(
            roundedBox(fullW * 0.92, fullH * 0.82, 0.026, 0.01),
            matCushion,
            0,
            0,
            fullD / 2 - 0.032,
          );
          group.add(innerBackCushion);

          const sideCushionA = makeMesh(
            roundedBox(0.026, fullH * 0.82, fullD * 0.9, 0.01),
            matCushion,
            -fullW / 2 + 0.032,
            0,
            0,
          );
          group.add(sideCushionA);

          const sideCushionB = makeMesh(
            roundedBox(0.026, fullH * 0.82, fullD * 0.9, 0.01),
            matCushion,
            fullW / 2 - 0.032,
            0,
            0,
          );
          group.add(sideCushionB);

          const drawerHandleColors = [0xf9cf58, 0x8ae2cf, 0xf6a7c1];
          // 맨 아래 통짜 서랍도 양쪽에서 잡을 수 있게 좌우 손잡이를 모두 배치한다.
          [-1, 1].forEach((handleSide) => {
            const handle = addClick(
              makeMesh(
                roundedBox(0.034, 0.22, 0.115, 0.018),
                new THREE.MeshStandardMaterial({
                  color: drawerHandleColors[rowIndex],
                  roughness: 0.72,
                  metalness: 0.03,
                }),
                handleSide * (fullW / 2 + 0.018),
                0,
                -fullD / 2 + 0.06,
              ),
              'drawer',
              rowIndex,
            );
            group.add(handle);
          });

          const proxy = addClick(
            makeMesh(
              new THREE.BoxGeometry(fullW, fullH, fullD),
              new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.001,
              }),
              0,
              0,
              0,
            ),
            'drawer',
            rowIndex,
          );
          group.add(proxy);

          addSingleBottomDrawerContents(group, fullH);

          cabinet.add(group);
          pair.push(group);
          drawerRows.push(pair);
          return;
        }

        for (const side of [-1, 1]) {
          const halfW = (W - WALL * 2) / 2 - 0.135;
          const halfH = drawerH - 0.06;
          const halfD = BACK_D - 0.08;
          const group = new THREE.Group();
          group.position.set(side * (halfW / 2 + 0.07), y, -D / 2 + BACK_D / 2);
          group.userData.closedX = group.position.x;
          group.userData.openX = group.position.x + side * halfW * 0.86;
          group.userData.targetX = group.userData.closedX;
          group.userData.closedZ = group.position.z;
          group.userData.openZ = group.position.z;
          group.userData.targetZ = group.userData.closedZ;

          addGlassWall(group, halfW, 0.022, halfD, 0, -halfH / 2, 0);
          addGlassWall(group, halfW, halfH, 0.022, 0, 0, -halfD / 2);
          addGlassWall(group, halfW, halfH, 0.022, 0, 0, halfD / 2);
          addGlassWall(group, 0.022, halfH, halfD, (halfW / 2) * side, 0, 0);
          addGlassWall(group, 0.022, halfH, halfD, (-halfW / 2) * side, 0, 0);

          const bottomCushion = makeMesh(
            roundedBox(halfW * 0.9, 0.026, halfD * 0.9, 0.01),
            matCushion,
            0,
            -halfH / 2 + 0.032,
            0,
          );
          group.add(bottomCushion);

          const innerBackCushion = makeMesh(
            roundedBox(halfW * 0.9, halfH * 0.82, 0.026, 0.01),
            matCushion,
            0,
            0,
            halfD / 2 - 0.032,
          );
          group.add(innerBackCushion);

          const sideCushionA = makeMesh(
            roundedBox(0.026, halfH * 0.82, halfD * 0.9, 0.01),
            matCushion,
            -halfW / 2 + 0.032,
            0,
            0,
          );
          group.add(sideCushionA);

          const sideCushionB = makeMesh(
            roundedBox(0.026, halfH * 0.82, halfD * 0.9, 0.01),
            matCushion,
            halfW / 2 - 0.032,
            0,
            0,
          );
          group.add(sideCushionB);

          const drawerHandleColors = [0xf9cf58, 0x8ae2cf, 0xf6a7c1];
          const handle = addClick(
            makeMesh(
              roundedBox(0.034, 0.22, 0.115, 0.018),
              new THREE.MeshStandardMaterial({
                color: drawerHandleColors[rowIndex],
                roughness: 0.72,
                metalness: 0.03,
              }),
              side * (halfW / 2 + 0.018),
              0,
              -halfD / 2 + 0.06,
            ),
            'drawer',
            rowIndex,
          );
          group.add(handle);

          const proxy = addClick(
            makeMesh(
              new THREE.BoxGeometry(halfW, halfH, halfD),
              new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.001,
              }),
              0,
              0,
              0,
            ),
            'drawer',
            rowIndex,
          );
          group.add(proxy);

          addDrawerContents(group, rowIndex, side, halfH);

          cabinet.add(group);
          pair.push(group);
        }

        drawerRows.push(pair);
      }

      makeDrawerRow(0);
      makeDrawerRow(1);
      makeDrawerRow(2);

      const books = new THREE.Group();

      function makeBookCoverTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#f8f6ef';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#93c5fd';
        roundRect(ctx, 42, 52, 428, 150, 38);
        ctx.fill();

        ctx.fillStyle = '#2563eb';
        roundRect(ctx, 42, 820, 428, 96, 28);
        ctx.fill();

        ctx.fillStyle = '#111827';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '800 64px Malgun Gothic, Apple SD Gothic Neo, sans-serif';
        ctx.fillText('초등', 256, 390);
        ctx.fillText('교과서', 256, 480);

        ctx.fillStyle = '#ffffff';
        ctx.font = '700 44px Malgun Gothic, Apple SD Gothic Neo, sans-serif';
        ctx.fillText('1학년', 256, 868);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = 4;
        return texture;
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      const singleBook = new THREE.Group();
      const bookW = 1.34;
      const bookH = 2.08;
      const bookD = 0.18;

      const bookBody = makeMesh(
        roundedBox(bookW, bookH, bookD, 0.026),
        new THREE.MeshStandardMaterial({
          color: 0xf7f3e8,
          roughness: 0.84,
          metalness: 0.01,
        }),
        0,
        0,
        0,
      );
      singleBook.add(bookBody);

      const bookPages = makeMesh(
        new THREE.BoxGeometry(bookW * 0.88, bookH * 0.9, bookD * 0.72),
        new THREE.MeshStandardMaterial({
          color: 0xf5f1e8,
          roughness: 0.96,
          metalness: 0,
        }),
        bookW * 0.04,
        0,
        0,
      );
      singleBook.add(bookPages);

      const bookSpine = makeMesh(
        new THREE.BoxGeometry(bookW * 0.13, bookH * 1.01, bookD * 1.05),
        new THREE.MeshStandardMaterial({
          color: 0x2563eb,
          roughness: 0.82,
          metalness: 0.01,
        }),
        -bookW / 2 + bookW * 0.065,
        0,
        0,
      );
      singleBook.add(bookSpine);

      const coverPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(bookW * 0.93, bookH * 0.95),
        new THREE.MeshStandardMaterial({
          map: makeBookCoverTexture(),
          roughness: 0.76,
          metalness: 0.01,
        }),
      );
      coverPlane.position.set(0, 0, bookD / 2 + 0.004);
      singleBook.add(coverPlane);

      singleBook.position.set(0, bookH / 2 + 0.08, Z_DIV + FRONT_D / 2);
      singleBook.rotation.z = -0.025;
      books.add(singleBook);

      shell.add(books);

      function setCover(open) {
        state.coverOpen = open;
      }

      function setLid(open) {
        state.lidOpen = open;
      }

      function setDrawer(index, open) {
        state.drawersOpen[index] = open;
        drawerRows[index].forEach((h) => {
          h.userData.targetX = open ? h.userData.openX : h.userData.closedX;
          h.userData.targetZ = open ? h.userData.openZ : h.userData.closedZ;
        });
      }

      function toggleAction(type, index) {
        if (type === 'cover') setCover(!state.coverOpen);
        if (type === 'lid') setLid(!state.lidOpen);
        if (type === 'drawer') {
          if (!state.coverOpen) setCover(true);
          setDrawer(index, !state.drawersOpen[index]);
        }
      }

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let down = { x: 0, y: 0 };
      let moved = false;

      renderer.domElement.addEventListener('pointerdown', (e) => {
        down = { x: e.clientX, y: e.clientY };
        moved = false;
      });

      renderer.domElement.addEventListener('pointermove', (e) => {
        if (
          Math.abs(e.clientX - down.x) > 5 ||
          Math.abs(e.clientY - down.y) > 5
        )
          moved = true;
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        if (moved) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(clickables, true);
        if (!hits.length) return;
        const obj = hits[0].object;
        toggleAction(obj.userData.type, obj.userData.index);
      });

      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'r') {
          setCover(false);
          setLid(false);
          for (let i = 0; i < 3; i++) setDrawer(i, false);
        }
      });

      const clock = new THREE.Clock();
      function lerp(a, b, t) {
        return a + (b - a) * Math.min(1, t);
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const speed = 4.8;

        coverGroup.rotation.x = lerp(
          coverGroup.rotation.x,
          state.coverOpen ? -Math.PI * 0.84 : 0,
          dt * speed,
        );
        lidGroup.rotation.x = lerp(
          lidGroup.rotation.x,
          state.lidOpen ? -Math.PI * 0.64 : 0,
          dt * speed,
        );

        drawerRows.forEach((pair) => {
          pair.forEach((h) => {
            h.position.x = lerp(h.position.x, h.userData.targetX, dt * speed);
            h.position.z = lerp(h.position.z, h.userData.targetZ, dt * speed);
          });
        });

        controls.update();
        renderer.render(scene, camera);
      }

      animate();

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
